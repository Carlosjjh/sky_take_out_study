apiVersion: v1
kind: Service
metadata:
  name: sky-server
  namespace: sky-lab
spec:
  type: NodePort
  selector:
    app: sky-server
  ports:
    - name: http
      port: 8088
      targetPort: http
      nodePort: 30088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-server
  namespace: sky-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sky-server
  template:
    metadata:
      labels:
        app: sky-server
    spec:
      containers:
        - name: sky-server
          image: sky-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: sky_take_out
            - name: DB_USERNAME
              value: sky
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sky-secrets
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sky-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
